name: Lint - YAML

on:
  workflow_call:
  workflow_dispatch:

jobs:
  run-yamllint:
    runs-on: ubuntu-22.04

    steps:
    - name: check out code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: install yamllint
      run: pip install -r ./build/yamllint-requirements.txt --require-hashes

    - name: run yamllint
      run: yamllint --no-warnings .
